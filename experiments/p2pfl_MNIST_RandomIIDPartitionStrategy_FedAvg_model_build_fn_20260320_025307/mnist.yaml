description: "Example of using P2PFL with the MNIST dataset, a collection of handwritten digits commonly used for training image processing systems."

# Remote loggers configuration (optional)
remote_loggers:
  # wandb_api_key: "your-api-key"
  # wandb_project: "p2pfl-mnist"
  # p2pfl_web_url: "https://your-server.com"
  # p2pfl_web_key: "your-api-key"

# Defines network setup
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 3
  topology: "ring"
  additional_connections: []

# Defines experiment settings
experiment:
  name: "minimal_mnist_test"
  rounds: 10
  epochs: 1
  trainset_size: 10
  seed: 666
  wait_timeout: 600

  # Dataset settings
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 64
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "RandomIIDPartitionStrategy"
      reduced_dataset: true
      reduction_factor: 10
      params: {}

  # Learning algorithm configuration
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      lr_rate: 0.001

  # Aggregation algorithm configuration
  aggregator:
    package: "p2pfl.learning.aggregators.fedavg"
    aggregator: "FedAvg"
    params: {}
 
    # package: "p2pfl.learning.aggregators.psgd"
    # aggregator: "PSGD"
    # params: 
    #   lr: 0.001

# General experiment settings
settings:
  general:
    log_level: "INFO" # Logging verbosity: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
    grpc_timeout: 2
    disable_ray: False

  SSL:
    use_ssl: false
    CA_CRT: None
    SERVER_CRT: None
    CLIENT_CRT: None
    SERVER_KEY: None
    CLIENT_KEY: None
  heartbeat:
    period: 10
    timeout: 99999 
    wait_convergence: 20
    exclude_beat_logs: true
  gossip:
    period: 0.5
    ttl: 50
    messages_per_period: 200
    amount_last_messages_saved: 1000
    models_period: 1
    models_per_round: 4
    exit_on_x_equal_rounds: 50
  training:
    vote_timeout: 30
    aggregation_timeout: 300

# Profiling configuration
profiling:
  enabled: false
  measure_time: true
  output_dir: "profile/mnist"
