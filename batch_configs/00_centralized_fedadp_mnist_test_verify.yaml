description: "Centralized MNIST FedAdp Verification Test"
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 5
  topology: "star"
experiment:
  centralized: true
  name: "centralized_fedadp_mnist_test_verify"
  rounds: 5
  epochs: 1
  trainset_size: 5
  seed: 666
  wait_timeout: 1800
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 128
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "RandomIIDPartitionStrategy"
      reduced_dataset: true
      reduction_factor: 10
      params: {}
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      input_size: 784
      lr_rate: 0.001
  aggregator:
    package: "p2pfl.learning.aggregators.fedadp"
    aggregator: "FedAdp"
    params: 
      learning_rate: 0.001
      decay_rate: 0.95
      alpha: 0.5
settings:
  general:
    log_level: "INFO"
    grpc_timeout: 2
    disable_ray: False
  heartbeat:
    timeout: 99999
  training:
    aggregation_timeout: 300
