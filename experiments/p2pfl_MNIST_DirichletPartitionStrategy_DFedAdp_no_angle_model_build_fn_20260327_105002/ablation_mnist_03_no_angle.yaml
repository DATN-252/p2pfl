description: "Ablation MNIST: No Angle"
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 10
  topology: "custom"
experiment:
  name: "ablation_mnist_no_angle"
  rounds: 10
  epochs: 1
  trainset_size: 10
  seed: 666
  wait_timeout: 600
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 64
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "DirichletPartitionStrategy"
      params:
        alpha: 0.1
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      lr_rate: 0.001
  aggregator:
    package: "p2pfl.learning.aggregators.ablation"
    aggregator: "DFedAdp_no_angle"
    params: 
      learning_rate: 0.001
      alpha: 1.0
settings:
  general:
    disable_ray: False
    grpc_timeout: 120
  heartbeat:
    timeout: 99999
    period: 10
    wait_convergence: 180
  training:
    vote_timeout: 120
    aggregation_timeout: 300
