description: "Example of using P2PFL with the MNIST dataset, a collection of handwritten digits commonly used for training image processing systems."

# Remote loggers configuration (optional)
remote_loggers:
  # wandb_api_key: "your-api-key"
  # wandb_project: "p2pfl-mnist"
  # p2pfl_web_url: "https://your-server.com"
  # p2pfl_web_key: "your-api-key"

# Defines network setup
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 3
  topology: "ring"   # Network topology: "line", "ring", "star", "full", null for custom
  additional_connections: []

# Defines experiment settings
experiment:
  name: "my_experiment"
  rounds: 100
  epochs: 1
  trainset_size: 30
  seed: 666
  wait_timeout: 18000

  # Dataset settings
  dataset:
    source: "huggingface" # Dataset source: "huggingface", "csv", etc.
    name: "p2pfl/MNIST"
    batch_size: 128
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "DirichletPartitionStrategy"
      reduced_dataset: false # For testing purposes
      reduction_factor: 10

      params:
        alpha: 0.5
        min_partition_size: 10
        self_balancing: false

  # Learning algorithm configuration
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch" # mlp_pytorch | mlp_tensorflow
    model_build_fn: "model_build_fn"
    params: {}
    # Learning algorithm parameters (algorithm-specific)
    #compression:
    #ptq:
    #  dtype: "int8"
    #topk:
    #  k: 0.1
    #zlib:
    #  level: 6

  # Aggregation algorithm configuration
  aggregator:
    package: "p2pfl.learning.aggregators.dsgt_aggregator"
    aggregator: "DSGTAggregator"
    params: # DSGTAggregator parameters
      alpha: 0.01
      # Mixing weights for a 3-node ring topology (doubly stochastic)
      # The keys are the node addresses, which are assigned by the framework.
      # This requires the addresses to be known beforehand. For local tests,
      # they are typically '127.0.0.1:50051', '127.0.0.1:50052', etc.
      mixing_weights:
        '127.0.0.1:50051': {'127.0.0.1:50051': 0.3333, '127.0.0.1:50052': 0.3333, '127.0.0.1:50053': 0.3333}
        '127.0.0.1:50052': {'127.0.0.1:50051': 0.3333, '127.0.0.1:50052': 0.3333, '127.0.0.1:50053': 0.3333}
        '127.0.0.1:50053': {'127.0.0.1:50051': 0.3333, '127.0.0.1:50052': 0.3333, '127.0.0.1:50053': 0.3333}


# General experiment settings
settings:
  general:
    log_level: "INFO" # Logging verbosity: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
    grpc_timeout: 2
    disable_ray: False

  SSL:
    use_ssl: false
    CA_CRT: None
    SERVER_CRT: None
    CLIENT_CRT: None
    SERVER_KEY: None
    CLIENT_KEY: None
  heartbeat:
    period: 2
    timeout: 3600
    wait_convergence: 4
    exclude_beat_logs: true
  gossip:
    period: 1
    ttl: 10
    messages_per_period: 200
    amount_last_messages_saved: 1000
    models_period: 1
    models_per_round: 4
    exit_on_x_equal_rounds: 50
  training:
    vote_timeout: 30
    aggregation_timeout: 300

# Profiling configuration
profiling:
  enabled: false
  measure_time: true
  output_dir: "profile/mnist"
