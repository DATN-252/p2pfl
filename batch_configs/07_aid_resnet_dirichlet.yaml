# AID Non-IID Dirichlet Experiment Config
network:
  nodes: 5 # Simulate 5 nodes
  package: p2pfl.communication.protocols.protobuff.grpc
  protocol: GrpcCommunicationProtocol
  topology: full
  additional_connections: []

experiment:
  name: aid_resnet_dirichlet_0.5
  rounds: 10
  epochs: 1
  trainset_size: 3
  
  dataset:
    source: custom
    name: AID
    package: p2pfl.examples.aid.dataset
    class: AIDDataset
    params:
      dataset_id: jiayuanchengala/aid-scene-classification-datasets
      batch_size: 16
    partitioning:
      package: p2pfl.learning.dataset.partition_strategies
      strategy: DirichletPartitionStrategy
      params:
        alpha: 0.5 # Non-IID level
    transforms:
      package: p2pfl.examples.aid.transforms
      function: get_aid_transforms
    params:
      batch_size: 16

  model:
    package: p2pfl.examples.aid.model.resnet_aid
    model_build_fn: model_build_fn
    params:
      num_classes: 30
      learning_rate: 0.0001
      gamma: 2.0
      alpha: 1.0

  aggregator:
    package: p2pfl.learning.aggregators.fedavg
    aggregator: FedAvg

settings:
  training:
    {}
  general:
    LOG_LEVEL: INFO
    DISABLE_RAY: True
