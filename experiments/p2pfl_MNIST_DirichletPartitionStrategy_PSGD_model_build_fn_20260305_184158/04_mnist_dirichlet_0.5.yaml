description: "MNIST Dirichlet 0.5 - PSGD + SGD"
network:
  package: "p2pfl.communication.protocols.protobuff.grpc"
  protocol: "GrpcCommunicationProtocol"
  nodes: 50
  topology: custom
experiment:
  name: "mnist_dirichlet_0.5_psgd_sgd"
  rounds: 100
  epochs: 1
  trainset_size: 50
  seed: 666
  wait_timeout: 18000
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 128
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "DirichletPartitionStrategy"
      params:
        alpha: 0.5
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      lr_rate: 0.01
      optimizer_name: "sgd"
      momentum: 0.0
  aggregator:
    package: "p2pfl.learning.aggregators.psgd"
    aggregator: "PSGD"
    params: 
      lr: 0.01
settings:
  general:
    disable_ray: False
    grpc_timeout: 120
  heartbeat:
    timeout: 99999
    period: 10
    wait_convergence: 180
  training:
    vote_timeout: 120
    aggregation_timeout: 300
