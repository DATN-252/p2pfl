description: "Verification Test - Small Scale (PSGD + SGD)"
network:
  package: "p2pfl.communication.protocols.protobuff.grpc"
  protocol: "GrpcCommunicationProtocol"
  nodes: 3
  topology: custom
experiment:
  name: "verify_test_psgd_sgd"
  rounds: 5
  epochs: 1
  trainset_size: 3
  seed: 666
  wait_timeout: 10
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 128
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "RandomIIDPartitionStrategy"
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      lr_rate: 0.01
      optimizer_name: "sgd"
      momentum: 0.0
  aggregator:
    package: "p2pfl.learning.aggregators.psgd"
    aggregator: "PSGD"
    params: 
      lr: 0.01
settings:
  general:
    disable_ray: False
    grpc_timeout: 30
  heartbeat:
    timeout: 60
    period: 2
    wait_convergence: 10
  training:
    vote_timeout: 30
    aggregation_timeout: 60
