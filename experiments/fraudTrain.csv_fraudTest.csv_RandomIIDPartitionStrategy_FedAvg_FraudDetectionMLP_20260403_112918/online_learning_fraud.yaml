# Online Learning Test Config
network:
  nodes: 1 # Single node test

experiment:
  name: online_fraud_test
  rounds: 1
  epochs: 1
  trainset_size: 1
  
  dataset:
    source: kaggle
    dataset_id: kartik2112/fraud-detection
    name: 
      train: fraudTrain.csv
      test: fraudTest.csv
    partitioning:
      strategy: RandomIIDPartitionStrategy
    params:
      batch_size: 32

  model:
    package: p2pfl.examples.fraud.model.mlp_fraud
    model_build_fn: FraudDetectionMLP
    params:
      input_size: 15

  aggregator:
    package: p2pfl.learning.aggregators.fedavg
    aggregator: FedAvg

settings:
  training: {}
  general:
    LOG_LEVEL: INFO
