# AID Scene Classification - Centralized Mode
network:
  nodes: 5
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  topology: star # Recommended for Centralized
  additional_connections: []

experiment:
  name: aid_resnet_centralized
  rounds: 100
  epochs: 1
  trainset_size: 5
  centralized: True # ACTIVATE CENTRALIZED MODE
  
  dataset:
    source: custom
    name: AID
    package: p2pfl.examples.aid.dataset
    class: AIDDataset
    params:
      dataset_id: jiayuanchengala/aid-scene-classification-datasets
      batch_size: 16
    partitioning:
      package: p2pfl.learning.dataset.partition_strategies
      strategy: RandomIIDPartitionStrategy
    transforms:
      package: p2pfl.examples.aid.transforms
      function: get_aid_transforms
    params:
      batch_size: 16

  model:
    package: p2pfl.examples.aid.model.resnet_aid
    model_build_fn: model_build_fn
    params:
      num_classes: 30
      learning_rate: 0.001
      model_type: resnet18
      freeze_backbone: True

  aggregator:
    package: p2pfl.learning.aggregators.centralized_fedavg
    aggregator: CentralizedFedAvg
    params:
      num_clients: 5

settings:
  training:
    {}
  general:
    LOG_LEVEL: INFO
    DISABLE_RAY: True
