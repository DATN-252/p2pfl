# AID Scene Classification - DFedAdp Mode (Decentralized)
network:
  nodes: 10
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  topology: full
  additional_connections: []

experiment:
  name: aid_resnet_dfedadp
  rounds: 100
  epochs: 1
  trainset_size: 10
  wait_timeout: 36000 # 10 hours overall timeout
  
  dataset:
    source: custom
    name: AID
    package: p2pfl.examples.aid.dataset
    class: AIDDataset
    params:
      dataset_id: jiayuanchengala/aid-scene-classification-datasets
      batch_size: 16
    partitioning:
      package: p2pfl.learning.dataset.partition_strategies
      strategy: RandomIIDPartitionStrategy
    transforms:
      package: p2pfl.examples.aid.transforms
      function: get_aid_transforms
    params:
      batch_size: 16

  model:
    package: p2pfl.examples.aid.model.resnet_aid
    model_build_fn: model_build_fn
    params:
      num_classes: 30
      learning_rate: 0.0001 # Reduced LR for better stability with transfer learning
      model_type: resnet18
      freeze_backbone: False # Unfreeze to allow full adaptation
      alpha: 1.0 # Focal Loss Alpha
      gamma: 2.0 # Focal Loss Gamma

  aggregator:
    package: p2pfl.learning.aggregators.dfedadp
    aggregator: DFedAdp
    params:
      learning_rate: 0.1 # Increased internal LR for DFedAdp
      decay_rate: 0.95
      alpha: 0.5 # Softer Gompertz function for easier initial convergence

settings:
  training:
    aggregation_timeout: 1800 # 30 minutes per round for aggregation
  heartbeat:
    timeout: 3600 # 1 hour timeout to prevent disconnection during heavy training
    period: 30 # Send heartbeat less frequently (every 30s instead of 1s)
  general:
    LOG_LEVEL: INFO
    DISABLE_RAY: True # Keep sequential to avoid OOM
, but increased timeouts will help
