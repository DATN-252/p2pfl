description: "Fraud Detection using P2PFL with custom CSV dataset"
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 3
  topology: "ring" # Network topology: "line", "ring", "star", "full"
  additional_connections:
    - [0, 1]
    - [1, 2]
experiment:
  name: "fraud_detection_experiment"
  rounds: 20
  epochs: 3
  trainset_size: 100
  seed: 666
  wait_timeout: 120
  dataset:
    source: "kaggle"
    dataset_id: "kartik2112/fraud-detection"
    name:
      train: "fraudTrain.csv"
      test: "fraudTest.csv"
    batch_size: 32
    transforms:
      package: "p2pfl.examples.fraud.transforms"
      function: "get_fraud_transforms"
      params: {}
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "RandomIIDPartitionStrategy"
      params:
        label_tag: "is_fraud" 
  model:
    package: "p2pfl.examples.fraud.model.mlp_fraud"
    model_build_fn: "model_build_fn"
    params:
      pos_weight: 300.0
      learning_rate: 0.0005

  aggregator:
    package: "p2pfl.learning.aggregators.dfedadp"
    aggregator: "DFedAdp"
    params: 
      learning_rate: 0.001
      decay_rate: 0.95
      alpha: 0.5

settings:
  general:
    disable_ray: False
    grpc_timeout: 120
  heartbeat:
    timeout: 99999
    period: 10
    wait_convergence: 180
  training:
    vote_timeout: 120
    aggregation_timeout: 300