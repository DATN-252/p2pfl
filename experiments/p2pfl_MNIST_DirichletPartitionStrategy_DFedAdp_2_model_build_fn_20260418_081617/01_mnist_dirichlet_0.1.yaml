description: "MNIST Dirichlet 0.1 - Testing DFedAdp_2"
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 20
  topology: "custom"
experiment:
  name: "mnist_dirichlet_0.1_test_dfedadp2"
  rounds: 20
  epochs: 1
  trainset_size: 20
  seed: 666
  wait_timeout: 18000
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 128
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "DirichletPartitionStrategy"
      params:
        alpha: 0.1
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      lr_rate: 0.0001
  aggregator:
    package: "p2pfl.learning.aggregators.dfedadp2"
    aggregator: "DFedAdp_2"
    params: 
      base_learning_rate: 0.001
      min_learning_rate: 0.0001
      B: 2.0
      beta: 1.0
settings:
  general:
    disable_ray: False
    grpc_timeout: 120
  heartbeat:
    timeout: 99999
    period: 10
    wait_convergence: 180
  training:
    vote_timeout: 120
    aggregation_timeout: 300
