description: "DSGT Verification Test"
network:
  package: "p2pfl.communication.protocols.protobuff.memory"
  protocol: "MemoryCommunicationProtocol"
  nodes: 5
  topology: "full"
experiment:
  name: "dsgt_verify"
  rounds: 20
  epochs: 1
  trainset_size: 5
  seed: 42
  wait_timeout: 30
  dataset:
    source: "huggingface"
    name: "p2pfl/MNIST"
    batch_size: 64
    partitioning:
      package: "p2pfl.learning.dataset.partition_strategies"
      strategy: "RandomIIDPartitionStrategy"
  model:
    package: "p2pfl.examples.mnist.model.mlp_pytorch"
    model_build_fn: "model_build_fn"
    params: 
      lr_rate: 0.01
  aggregator:
    package: "p2pfl.learning.aggregators.dsgt"
    aggregator: "DSGTAggregator"
    params: 
      alpha: 0.01
      beta: 0.9
settings:
  general:
    disable_ray: False
    grpc_timeout: 60
  heartbeat:
    timeout: 300
    period: 5
    wait_convergence: 30
  training:
    vote_timeout: 60
    aggregation_timeout: 120
    packaging_interval: 2
